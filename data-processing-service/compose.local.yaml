# Standalone local start: no external network or Supabase credentials required.
services:
  data-processing:
    build: .
    environment:
      MONITORING_BASE_URL: ${MONITORING_BASE_URL:-http://host.docker.internal:8080}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      SUPABASE_ENABLED: ${SUPABASE_ENABLED:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_API_KEY: ${SUPABASE_API_KEY:-}
      SUPABASE_READ_TOKEN: ${SUPABASE_READ_TOKEN:-}
      HISTORICAL_MAX_PAGE_SIZE: ${HISTORICAL_MAX_PAGE_SIZE:-500}
    ports:
      - "127.0.0.1:${DATA_PROCESSING_LOCAL_PORT:-8001}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
